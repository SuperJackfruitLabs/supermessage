name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first: these jobs build the
# whole Rust tree, and a queue of superseded runs is the main way a small
# project burns its Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on a Rust warning in CI without making every local
  # `cargo build` painful.
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # No pinned version: `packageManager` in package.json is the one
      # source of truth, and pinning here as well makes the action fail with
      # "multiple versions of pnpm specified" the moment the two drift — which
      # is what happened when the lockfile moved to pnpm 11.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Type and template check
        run: pnpm check

      - name: Build
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # webkit2gtk 4.1 is the Tauri 2 line (4.0 is Tauri 1). libxdo is
        # needed by the tray/window plumbing, patchelf by the AppImage
        # bundler in the release workflow.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No pinned version: `packageManager` in package.json is the one
      # source of truth, and pinning here as well makes the action fail with
      # "multiple versions of pnpm specified" the moment the two drift — which
      # is what happened when the lockfile moved to pnpm 11.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the frontend
        # Not redundant with the `frontend` job. `tauri::generate_context!`
        # resolves `frontendDist` (`../build`) at compile time, so the Rust
        # crate does not compile at all unless the frontend output exists on
        # disk first. Anything that touches cargo here needs this.
        run: pnpm build

      - name: Formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        # `-D warnings` explicitly, even though RUSTFLAGS already carries it:
        # RUSTFLAGS denies *rustc* lints, and clippy's own lints are a
        # separate set that it would otherwise report as warnings and exit 0
        # on. Without this the job goes green on a tree full of clippy
        # findings.
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test --all-features
        working-directory: src-tauri

  ios:
    name: iOS
    # macOS runners are 10x the minute cost of Linux ones on private repos.
    # This one is public, so the job is free — but it is also the reason to
    # keep it lean: it builds the core in `dev`, not `release`.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The two slices `build-xcframework.sh` packages. No x86_64
          # simulator: the runner is Apple silicon and an unused slice is
          # build time for nobody.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Generate the Xcode project
        # `apple/Supermessage.xcodeproj` is gitignored — `project.yml` is the
        # source of truth — so a fresh clone has no project to build.
        run: |
          brew install xcodegen
          cd apple && xcodegen generate

      - name: Build the XCFramework and regenerate the bindings
        # `--debug`: this job exists to prove the Swift compiles against the
        # Rust and the tests pass, and a `release` core answers neither
        # question differently while costing several minutes more.
        run: ./scripts/build-xcframework.sh --debug

      - name: The checked-in bindings match the Rust that generates them
        # The bindings are committed, the framework is not — so a Mac builds
        # the committed Swift against whatever Rust it has locally. UniFFI
        # serialises field *order*, not names, so a rename that nobody
        # regenerated links cleanly and fails at runtime, or worse, silently
        # reads the wrong field. Nothing else in the tree would notice.
        run: |
          if ! git diff --quiet -- apple/Generated; then
            echo "::error::apple/Generated is stale — run ./scripts/build-xcframework.sh and commit the result"
            git diff --stat -- apple/Generated
            exit 1
          fi

      - name: Choose a simulator
        id: sim
        # Resolved at run time, not hard-coded. The first run of this job asked
        # for "iPhone 16 Pro" and xcodebuild answered with a list containing no
        # concrete simulators at all — only `Any iOS Simulator Device`
        # placeholders — because the image's runtime set is tied to the Xcode
        # it ships and neither is ours to pin. Both lists are printed so a
        # future image change reads as a fact rather than a mystery.
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
          pick() {
            xcrun simctl list devices available --json \
              | jq -r '[.devices | to_entries[]
                        | select(.key | test("iOS"))
                        | .value[]]
                       | map(select(.name | test("^iPhone")))
                       | last | .udid // empty'
          }
          UDID="$(pick)"
          if [ -z "$UDID" ]; then
            echo "No iOS simulator on this image — fetching the platform."
            xcodebuild -downloadPlatform iOS
            UDID="$(pick)"
          fi
          if [ -z "$UDID" ]; then
            echo "::error::no iOS simulator available even after -downloadPlatform"
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Kit tests
        # The boundary and the stores. No live session, so these are the iOS
        # tests that can honestly run on a machine nobody has signed in on.
        run: |
          xcodebuild test \
            -project apple/Supermessage.xcodeproj \
            -scheme SupermessageKit \
            -destination "id=${{ steps.sim.outputs.udid }}"

      - name: The app and its UI tests compile
        # `build-for-testing`, not `test`. The `Supermessage` scheme runs
        # `SupermessageUITests`, and those drive a signed-in app against a
        # real homeserver — they wait 30s for a joined room named "Ganesha"
        # and fail without one. There is no session on a CI runner and
        # inventing one would mean shipping credentials into a public repo.
        #
        # Compiling them still earns its place: it is what catches a Rust
        # rename breaking `RichTextView` or a UI test that no longer matches
        # the app, which is most of what the iOS surface actually risks.
        # Running them stays a human step on a Mac — see AGENTS.md.
        run: |
          xcodebuild build-for-testing \
            -project apple/Supermessage.xcodeproj \
            -scheme Supermessage \
            -destination "id=${{ steps.sim.outputs.udid }}"

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Four cross targets for cargo-ndk (see build-android-libs.sh's own
          # header for why these four), no separate host target: rustup adds
          # the runner's native triple by default alongside whatever `targets`
          # names.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        # cargo-ndk has no prebuilt-binary listing in taiki-e/install-action,
        # so this falls back to cargo-binstall — still seconds, not the
        # several minutes a `cargo install --locked` compile would cost.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Point at the runner's prebuilt NDK
        # ubuntu-24.04 images ship several side-by-side NDKs, one of them
        # 29.0.14206865 — the exact version build-android-libs.sh's own
        # missing-NDK error tells a human to install. Using the same one CI
        # and a human get pointed at means a local repro of a CI failure is
        # actually reproducing it.
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build the host core
        # :kit's unit tests (RosterArrangementTest) load libsupermessage_ffi
        # through JNA from target/debug on the *host* triple, not from any of
        # the Android ABIs below — see :kit/build.gradle.kts. Skipping this
        # would make CI take the `-Pkit.allowMissingHostCore=true` escape
        # hatch, which turns the real test into a skip; the whole point of
        # this job is to run the real one.
        run: cargo build -p supermessage-ffi

      - name: Build the Rust core for Android and generate the Kotlin bindings
        # Four ABIs, ~15 minutes on a cold cache — see the script's own
        # header comment for the full story (cargo-ndk, the NDK, the 16KB
        # page size flag). Swatinem/rust-cache above makes a run against an
        # unchanged Cargo.lock mostly a linker pass instead.
        run: ./scripts/build-android-libs.sh

      - name: The checked-in bindings match the Rust that generates them
        # Android needs this even more than iOS's equivalent step does: the
        # generated Kotlin under android/core/src/main/kotlin/uniffi is
        # committed while the .so files that back it are gitignored (see
        # that script's header), so a Rust change can land with stale Kotlin
        # and the mismatch never shows up as a diff — only as a run-time
        # UnsatisfiedLinkError or, worse, a field read in the wrong order, on
        # whatever device happens to run it first.
        run: |
          if ! git diff --quiet -- android/core/src/main/kotlin/uniffi; then
            echo "::error::android/core/src/main/kotlin/uniffi is stale — run ./scripts/build-android-libs.sh and commit the result"
            git diff --stat -- android/core/src/main/kotlin/uniffi
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :kit:testDebugUnitTest :app:testDebugUnitTest :core:testDebugUnitTest
        working-directory: android

      - name: Enable KVM
        # The emulator needs hardware acceleration to be usable in CI at all;
        # GitHub's runner has the /dev/kvm device node but the image's default
        # udev rule leaves it root-only.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/avd/*/*
          key: avd-api36-google_apis-x86_64-v1

      - name: Create AVD and generate its snapshot for caching
        # Only runs on a cache miss. A booted-and-snapshotted AVD is what the
        # cache above actually stores; recreating it every run would spend
        # several of the minutes this step exists to save.
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # Pinned so the device is reproducible. Without a profile the runner
          # picks its own default, and two tests failed here that pass on a
          # taller local screen — a height dependency nobody could reproduce
          # because nobody knew what height CI was using.
          profile: pixel_6
          avd-name: ci-avd-36
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests
        # API 36 to match this project's compileSdk. arch/target are x86_64
        # + google_apis because the runner has no nested virtualization for
        # an arm64 image — hardware acceleration needs the emulator's guest
        # architecture to match the host's.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # Pinned so the device is reproducible. Without a profile the runner
          # picks its own default, and two tests failed here that pass on a
          # taller local screen — a height dependency nobody could reproduce
          # because nobody knew what height CI was using.
          profile: pixel_6
          avd-name: ci-avd-36
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest

      - name: Report per-ABI APK sizes
        # :app:connectedDebugAndroidTest above already assembles :app's own
        # split APKs as a dependency of installing it on the emulator — see
        # android/app/build.gradle.kts's `splits` block — so there is nothing
        # left to build here, only to measure.
        run: du -h android/app/build/outputs/apk/debug/*.apk

      - name: Upload arm64-v8a APK
        # The maintainer's own test device (a OnePlus 8T) is arm64-v8a — the
        # one of these five a human actually reaches for.
        uses: actions/upload-artifact@v4
        with:
          name: supermessage-debug-arm64-v8a
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: supermessage-debug-armeabi-v7a
          path: android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: supermessage-debug-x86_64
          path: android/app/build/outputs/apk/debug/app-x86_64-debug.apk

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: supermessage-debug-x86
          path: android/app/build/outputs/apk/debug/app-x86-debug.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: supermessage-debug-universal
          path: android/app/build/outputs/apk/debug/app-universal-debug.apk

  licences:
    name: Dependency licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo-deny
        # Enforces the licence rule in AGENTS.md — permissive licences plus
        # unmodified MPL-2.0, with GPL/AGPL/LGPL refused outright. The
        # project ships under MIT, so a copyleft dependency arriving through
        # a transitive bump is a licensing problem we want to hear about from
        # CI rather than from a user.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources
