name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first: these jobs build the
# whole Rust tree, and a queue of superseded runs is the main way a small
# project burns its Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on a Rust warning in CI without making every local
  # `cargo build` painful.
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # No pinned version: `packageManager` in package.json is the one
      # source of truth, and pinning here as well makes the action fail with
      # "multiple versions of pnpm specified" the moment the two drift — which
      # is what happened when the lockfile moved to pnpm 11.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Type and template check
        run: pnpm check

      - name: Build
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # webkit2gtk 4.1 is the Tauri 2 line (4.0 is Tauri 1). libxdo is
        # needed by the tray/window plumbing, patchelf by the AppImage
        # bundler in the release workflow.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No pinned version: `packageManager` in package.json is the one
      # source of truth, and pinning here as well makes the action fail with
      # "multiple versions of pnpm specified" the moment the two drift — which
      # is what happened when the lockfile moved to pnpm 11.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the frontend
        # Not redundant with the `frontend` job. `tauri::generate_context!`
        # resolves `frontendDist` (`../build`) at compile time, so the Rust
        # crate does not compile at all unless the frontend output exists on
        # disk first. Anything that touches cargo here needs this.
        run: pnpm build

      - name: Formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        # `-D warnings` explicitly, even though RUSTFLAGS already carries it:
        # RUSTFLAGS denies *rustc* lints, and clippy's own lints are a
        # separate set that it would otherwise report as warnings and exit 0
        # on. Without this the job goes green on a tree full of clippy
        # findings.
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test --all-features
        working-directory: src-tauri

  ios:
    name: iOS
    # macOS runners are 10x the minute cost of Linux ones on private repos.
    # This one is public, so the job is free — but it is also the reason to
    # keep it lean: it builds the core in `dev`, not `release`.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The two slices `build-xcframework.sh` packages. No x86_64
          # simulator: the runner is Apple silicon and an unused slice is
          # build time for nobody.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Generate the Xcode project
        # `apple/Supermessage.xcodeproj` is gitignored — `project.yml` is the
        # source of truth — so a fresh clone has no project to build.
        run: |
          brew install xcodegen
          cd apple && xcodegen generate

      - name: Build the XCFramework and regenerate the bindings
        # `--debug`: this job exists to prove the Swift compiles against the
        # Rust and the tests pass, and a `release` core answers neither
        # question differently while costing several minutes more.
        run: ./scripts/build-xcframework.sh --debug

      - name: The checked-in bindings match the Rust that generates them
        # The bindings are committed, the framework is not — so a Mac builds
        # the committed Swift against whatever Rust it has locally. UniFFI
        # serialises field *order*, not names, so a rename that nobody
        # regenerated links cleanly and fails at runtime, or worse, silently
        # reads the wrong field. Nothing else in the tree would notice.
        run: |
          if ! git diff --quiet -- apple/Generated; then
            echo "::error::apple/Generated is stale — run ./scripts/build-xcframework.sh and commit the result"
            git diff --stat -- apple/Generated
            exit 1
          fi

      - name: Choose a simulator
        id: sim
        # Resolved at run time, not hard-coded. The first run of this job asked
        # for "iPhone 16 Pro" and xcodebuild answered with a list containing no
        # concrete simulators at all — only `Any iOS Simulator Device`
        # placeholders — because the image's runtime set is tied to the Xcode
        # it ships and neither is ours to pin. Both lists are printed so a
        # future image change reads as a fact rather than a mystery.
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
          pick() {
            xcrun simctl list devices available --json \
              | jq -r '[.devices | to_entries[]
                        | select(.key | test("iOS"))
                        | .value[]]
                       | map(select(.name | test("^iPhone")))
                       | last | .udid // empty'
          }
          UDID="$(pick)"
          if [ -z "$UDID" ]; then
            echo "No iOS simulator on this image — fetching the platform."
            xcodebuild -downloadPlatform iOS
            UDID="$(pick)"
          fi
          if [ -z "$UDID" ]; then
            echo "::error::no iOS simulator available even after -downloadPlatform"
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Kit tests
        # The boundary and the stores. No live session, so these are the iOS
        # tests that can honestly run on a machine nobody has signed in on.
        run: |
          xcodebuild test \
            -project apple/Supermessage.xcodeproj \
            -scheme SupermessageKit \
            -destination "id=${{ steps.sim.outputs.udid }}"

      - name: The app and its UI tests compile
        # `build-for-testing`, not `test`. The `Supermessage` scheme runs
        # `SupermessageUITests`, and those drive a signed-in app against a
        # real homeserver — they wait 30s for a joined room named "Ganesha"
        # and fail without one. There is no session on a CI runner and
        # inventing one would mean shipping credentials into a public repo.
        #
        # Compiling them still earns its place: it is what catches a Rust
        # rename breaking `RichTextView` or a UI test that no longer matches
        # the app, which is most of what the iOS surface actually risks.
        # Running them stays a human step on a Mac — see AGENTS.md.
        run: |
          xcodebuild build-for-testing \
            -project apple/Supermessage.xcodeproj \
            -scheme Supermessage \
            -destination "id=${{ steps.sim.outputs.udid }}"

  licences:
    name: Dependency licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo-deny
        # Enforces the licence rule in AGENTS.md — permissive licences plus
        # unmodified MPL-2.0, with GPL/AGPL/LGPL refused outright. The
        # project ships under MIT, so a copyleft dependency arriving through
        # a transitive bump is a licensing problem we want to hear about from
        # CI rather than from a user.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources
