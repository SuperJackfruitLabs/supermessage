name: Play

# Build a signed Android App Bundle, and optionally send it to Play's
# internal track.
#
# Same shape as the TestFlight workflow next to it, for the same reasons:
# dispatch only, upload behind a checkbox that defaults to off. Play rejects a
# `versionCode` it has already seen, so an accidental upload burns a number
# exactly as it does on iOS.
#
# Android had no release path at all before this — `release.yml` builds the
# desktop Tauri app for three platforms and nothing produced an `.aab`.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to the Play internal track (unchecked = build the AAB only)'
        type: boolean
        default: false

jobs:
  play:
    name: Bundle${{ inputs.upload && ' and upload' || '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The cross-compile setup, copied from ci.yml's Android job rather than
      # reinvented — the first run of this workflow failed with
      # `error: no such command: ndk`, because `rustup target add` supplies
      # the targets and nothing supplies the tool that drives them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Point at the runner's prebuilt NDK
        # The same version ci.yml pins and `build-android-libs.sh`'s own
        # missing-NDK error names, so a local repro of a failure here is
        # actually reproducing it.
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      # All four ABIs, unlike ci.yml which builds only x86_64 on pull
      # requests. A release bundle carrying three of four would install on
      # most devices and fail on the rest, which is the kind of defect that
      # reaches a tester rather than a build log.
      - name: Build the core for every Android ABI
        run: ./scripts/build-android-libs.sh

      # Written to a path only this job can see, and deleted in the same step
      # it is used by nothing else. The keystore never reaches the workspace,
      # so it cannot be picked up by an artifact upload.
      - name: Install the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Fingerprint rather than contents, so a truncated secret is
          # diagnosable from the log without the keystore being in it.
          sha256sum "$RUNNER_TEMP/upload.jks" | cut -c1-16

      - name: Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # The same counter iOS uses, so "build 7" means one artifact pair
          # rather than two unrelated numbers. `build.gradle.kts` floors it.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew -q :app:printVersion
          ./gradlew :app:bundleRelease

      # Signed or not is the difference between an artifact Play accepts and
      # one it silently refuses at upload, so it is asserted here rather than
      # discovered there.
      - name: Check it is signed
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle -name '*.aab' | head -1)
          echo "$AAB ($(du -h "$AAB" | cut -f1))"
          if unzip -l "$AAB" | grep -qE "META-INF/(UPLOAD|CERT)\.(RSA|SF)"; then
            echo "signed"
          else
            echo "::error::the bundle is unsigned — is ANDROID_KEYSTORE_BASE64 set?"
            exit 1
          fi

      - name: The bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supermessage-aab
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      # Deliberately last, deliberately opt-in, and deliberately skipped when
      # the service account is absent — so the job is useful for producing a
      # bundle long before Play API access exists.
      - name: Upload to the internal track
        if: ${{ inputs.upload }}
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set — see docs/releasing.md"
            exit 1
          fi
          set -euo pipefail
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          chmod 600 "$RUNNER_TEMP/play.json"
          AAB=$(find android/app/build/outputs/bundle -name '*.aab' | head -1)
          python3 scripts/play-upload.py "$RUNNER_TEMP/play.json" "$AAB" internal
          rm -f "$RUNNER_TEMP/play.json"
