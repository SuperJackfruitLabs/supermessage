<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 340" width="390" height="340" role="img" aria-label="Supermessage">
  <title>Supermessage</title>
  <desc>Two overlapping speech bubbles.</desc>
  <!--
    Drawn, not traced. The source artwork is a 420px raster whose bubble edges
    are soft gradients rather than outlines, so tracing it reproduced the
    JPEG's noise at every size. Both bubbles measure as ellipses to within a
    pixel or two, so they are ellipses here, and each tail is a cubic that
    leaves and re-enters its ellipse's edge.

    Body and tail are two shapes sharing one `userSpaceOnUse` gradient, which
    is what makes them read as a single object: an `objectBoundingBox`
    gradient would restart at each shape and the seam would show.
  -->
  <defs>
    <linearGradient id="smBlue" gradientUnits="userSpaceOnUse" x1="9" y1="20" x2="271" y2="264">
      <stop offset="0" stop-color="#CBE1FB"/>
      <stop offset="1" stop-color="#9BC0FA"/>
    </linearGradient>
    <linearGradient id="smCoral" gradientUnits="userSpaceOnUse" x1="134" y1="99" x2="381" y2="329">
      <stop offset="0" stop-color="#FFA98A"/>
      <stop offset="1" stop-color="#FF8489"/>
    </linearGradient>
    <linearGradient id="smOver" gradientUnits="userSpaceOnUse" x1="134" y1="99" x2="271" y2="264">
      <stop offset="0" stop-color="#C0BCD2"/>
      <stop offset="1" stop-color="#CFACBD"/>
    </linearGradient>
    <clipPath id="smCoralShape">
      <ellipse cx="257.5" cy="196.5" rx="123.5" ry="97.5"/>
      <path d="M 316 270 C 330 294 344 304 354 320 C 366 340 340 350 314 338 C 278 322 244 298 220 276 Z"/>
    </clipPath>
  </defs>
    <ellipse cx="140.0" cy="124.0" rx="131.0" ry="104.0" fill="url(#smBlue)"/>
    <path d="M 78 200 C 66 226 52 236 42 252 C 30 272 56 282 82 270 C 118 254 152 230 176 208 Z" fill="url(#smBlue)"/>
    <ellipse cx="257.5" cy="196.5" rx="123.5" ry="97.5" fill="url(#smCoral)"/>
    <path d="M 316 270 C 330 294 344 304 354 320 C 366 340 340 350 314 338 C 278 322 244 298 220 276 Z" fill="url(#smCoral)"/>
  <!--
    Where they cross. Not a third traced shape: the blue bubble clipped to the
    coral one is the same region bounded by the two real curves, so every edge
    in the mark belongs to one of the two bubbles.
  -->
  <g clip-path="url(#smCoralShape)">
    <ellipse cx="140.0" cy="124.0" rx="131.0" ry="104.0" fill="url(#smOver)"/>
    <path d="M 78 200 C 66 226 52 236 42 252 C 30 272 56 282 82 270 C 118 254 152 230 176 208 Z" fill="url(#smOver)"/>
  </g>
</svg>
