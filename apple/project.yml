# The native iOS app.
#
# Three targets, and the reason for each:
#
#   SupermessageFFI  the generated bindings and the xcframework. **Swift 5**,
#                    because UniFFI 0.28's output is not `Sendable`-clean and a
#                    Swift 6 build of it is a wall of diagnostics that are not
#                    ours to fix. Quarantining it here is what lets everything
#                    else compile under strict concurrency, which is how the
#                    app's central invariant — nothing blocking on the main
#                    actor, no store mutated off it — becomes a compile error
#                    rather than a comment.
#
#   SupermessageKit  the boundary and the stores. Imports no SwiftUI. That is
#                    enforcement rather than taste: it is what stops view code
#                    leaking into the state layer, and what keeps the layer
#                    testable on its own.
#
#   Supermessage     the views.
#
# Regenerate with `xcodegen generate` from this directory after editing.
name: Supermessage
options:
  bundleIdPrefix: dev.supermessage
  deploymentTarget:
    # 18.0, not 17: `onScrollGeometryChange` and `ScrollPosition` landed in 18
    # and both go directly at the hardest problem in this app — anchoring the
    # timeline during back-pagination. Xcode 16.4 / the iOS 18.5 SDK is the
    # ceiling on this machine either way.
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    # Super Jackfruit Labs (OPC) Private Limited, not the personal team.
    # The personal team issues SEVEN-DAY provisioning profiles: an install made
    # on 2026-08-29 expired on 2026-09-05, and the only symptom is an app that
    # silently stops launching a week later — nothing points back to this line.
    # The organisation membership issues one-year profiles, and is what makes
    # TestFlight available at all.
    DEVELOPMENT_TEAM: N2QQPW2BRJ
    SWIFT_VERSION: "6.0"
    # Every target, not just the app: a framework and a test bundle are both
    # code-signed on iOS and both refuse to sign without one.
    GENERATE_INFOPLIST_FILE: YES

    # The version, which this project carried nowhere until now.
    #
    # `GENERATE_INFOPLIST_FILE: YES` synthesises an Info.plist, and it writes
    # only the keys it is given — so with neither of these set the built app had
    # no CFBundleShortVersionString and no CFBundleVersion at all. Every other
    # platform in this repo has been bumped together for ten releases while iOS
    # silently shipped versionless, which is also the first blocker in #35: App
    # Store Connect rejects an upload with no version, and rejects a build
    # number it has seen before.
    #
    # MARKETING_VERSION is the human one and tracks package.json. CURRENT_PROJECT_VERSION
    # is the build number, which must increase on every upload and never resets.
    MARKETING_VERSION: 0.0.11
    CURRENT_PROJECT_VERSION: 2

packages:
  # Renders every `#Preview` in the app to a PNG, from a test target, with no
  # test code per preview.
  #
  # **Test-only, and that is load-bearing.** It is linked to
  # `SupermessagePreviewTests` and to nothing else. The package also ships a
  # `PreviewGallery` product that would give an on-device browser, and it is
  # deliberately not used: that one links to the *app* target, so it would be
  # in a release build, and `scripts/tests/test_ios_preview_leak.sh` exists to
  # say that preview machinery is not.
  #
  # MIT, and maintained by Sentry since it acquired Emerge Tools in 2025. The
  # hosted product renders the same previews as a service; this is the half
  # that needs no account and uploads nothing.
  SnapshotPreviews:
    url: https://github.com/EmergeTools/SnapshotPreviews
    exactVersion: 0.18.0

targets:
  SupermessageFFI:
    type: framework
    platform: iOS
    sources:
      # Both files. `setup_scaffolding!()` runs in the core crate as well as
      # the FFI crate, so the DTOs and the `Core` object are declared in
      # separate files and neither resolves alone.
      - path: Generated/supermessage_ffi.swift
      - path: Generated/supermessage_core.swift
    dependencies:
      - framework: Supermessage.xcframework
        embed: false # a static library: linked, never embedded
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermessage.ffi
        SWIFT_VERSION: "5.0"
        # Generated code; its warnings are not ours to fix.
        SWIFT_SUPPRESS_WARNINGS: YES

  SupermessageKit:
    type: framework
    platform: iOS
    sources: [SupermessageKit]
    dependencies:
      - target: SupermessageFFI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermessage.kit
        SWIFT_STRICT_CONCURRENCY: complete

  Supermessage:
    type: application
    platform: iOS
    sources: [Supermessage]
    dependencies:
      - target: SupermessageKit
      - target: SupermessageFFI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermessage.ios
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: supermessage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Declared, so App Store Connect stops asking on every upload.
        #
        # Without this key each build is held after upload until somebody
        # answers the export-compliance question by hand, which turns a
        # scripted release into a scripted release plus a person. The answer
        # does not change between builds, so it belongs in the build.
        #
        # `NO` is the accurate answer, not the convenient one: this app's only
        # cryptography is TLS to a Matrix homeserver and the platform's own
        # keychain — both exempt under the standard-encryption exemption. It
        # would stop being true the day the app implements end-to-end
        # encryption itself rather than delegating it, which is worth
        # remembering because that is on the roadmap.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  SupermessageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SupermessageUITests]
    dependencies:
      - target: Supermessage
    settings:
      base:
        TEST_TARGET_NAME: Supermessage

  SupermessageKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SupermessageKitTests]
    dependencies:
      - target: SupermessageKit
      - target: SupermessageFFI

  # Renders the app's previews to PNGs. No test functions: the package
  # enumerates every `#Preview` in the host app and adds one test per preview
  # at run time.
  #
  # A **unit** test bundle rather than a UI one, because it has to run inside
  # the app's own process to reach the preview registry — a UI test drives the
  # app from outside and could not see it. That is also why it is hosted by
  # `Supermessage` rather than standing alone.
  #
  # Its own scheme, below. `SupermessageUITests` shares the `Supermessage`
  # scheme and needs a signed-in session against a real homeserver, so putting
  # this beside it would make it unrunnable on CI for reasons that have
  # nothing to do with previews.
  SupermessagePreviewTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SupermessagePreviewTests]
    dependencies:
      - target: Supermessage
      - package: SnapshotPreviews
        product: SnapshottingTests
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Supermessage.app/Supermessage"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # The previews are `#if DEBUG`, so a release build of this target
        # would find nothing to render. Stated rather than assumed.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  SupermessageKit:
    build:
      targets:
        SupermessageKit: all
        SupermessageKitTests: [test]
    test:
      targets: [SupermessageKitTests]
  Supermessage:
    build:
      targets:
        Supermessage: all
        SupermessageUITests: [test]
    test:
      targets: [SupermessageUITests]
    run: {}
  PreviewSnapshots:
    build:
      targets:
        Supermessage: all
        SupermessagePreviewTests: [test]
    test:
      targets: [SupermessagePreviewTests]
      # A fixed locale, for the same reason as the fixed timezone below and
      # found the same way — by the gate failing somewhere other than where
      # it was recorded.
      #
      # `TimelineRowView` formats a date divider with a `DateFormatter` at
      # `.medium` and no explicit locale, so it follows the device: this
      # machine is en_IN and renders `13 Sept 2026`, a runner renders
      # `Sep 13, 2026`. Two frames differed by exactly 3,428 pixels each —
      # the same number twice, because both draw the same divider.
      #
      # Pinned **here and not in the view**: the app should follow the
      # reader's locale. Only the baseline needs to stop moving.
      commandLineArguments:
        "-AppleLocale en_US_POSIX": true
        "-AppleLanguages (en)": true
      environmentVariables:
        # The package's own flag, mirroring the variable Xcode sets in a
        # preview. Nothing reads it yet; it is here so that the first preview
        # which wants to know it is being snapshotted — to skip an animation,
        # say — has the answer without a scheme change.
        # UTC, so a rendered clock does not depend on where the machine is.
        #
        # Android's baseline failed its first CI run on exactly this: six
        # frames differed by `11:30 PM` against `6:00 PM`, because the
        # recording machine is IST and the runner is UTC. `TimelineRowView`
        # formats an absolute `timestampMs` through the default zone, the
        # same as its Compose counterpart, so the same fix applies before the
        # same failure rather than after it.
        TZ: "UTC"
        SNAPSHOTS_RUNNING_FOR_PREVIEWS: "1"
        # Where the PNGs go. Overridden by `scripts/snapshot-previews.sh`;
        # without it the images are attachments inside the .xcresult, which
        # is exactly the format nobody can look at.
        TEST_RUNNER_SNAPSHOTS_EXPORT_DIR: "$(SRCROOT)/../.snapshots"
