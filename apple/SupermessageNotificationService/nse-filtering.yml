# Apple's notification-filtering entitlement for the Notification Service
# Extension. Included by ../project.yml ONLY when generated with
# SM_NSE_FILTERING=YES, and useful only beside SM_NSE=YES:
#
#     cd apple && SM_PUSH=YES SM_NSE=YES SM_EXTENSIONS=YES SM_NSE_FILTERING=YES xcodegen generate
#
# **Off by default, and NOT YET REQUESTED from Apple** (2026-09-28).
# `com.apple.developer.usernotifications.filtering` is granted on request
# (developer.apple.com/contact/request/notification-service), and a profile
# without it refuses to sign a target that claims it. Before turning this on:
#   - the request approved for the team;
#   - the entitlement enabled on the App ID `dev.supermessage.ios.nse`;
#   - the `supermessage NSE App Store` profile regenerated, and the
#     IOS_NSE_PROFILE_BASE64 secret replaced with it.
#
# What it changes: `SMNotificationFiltering` becomes YES, and the extension
# drops a push the core marked `suppress` (a reaction, an edit, a turn card,
# this account's own message) instead of showing its quiet one-line fallback
# (NotificationService.swift, `RemotePresentation`). Without the entitlement
# an extension cannot drop a push — an empty one is shown blank — which is why
# the flag and the entitlement come together, from this one file.
#
# XcodeGen merges this into nse.yml's target: the entitlements' properties
# are a dictionary, so this adds one key beside the App Group and keychain
# group rather than replacing them.
targets:
  SupermessageNotificationService:
    entitlements:
      path: SupermessageNotificationService.entitlements
      properties:
        com.apple.developer.usernotifications.filtering: true
    settings:
      base:
        SM_NSE_FILTERING: "YES"
