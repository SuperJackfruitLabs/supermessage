# The widget extension (the fleet Live Activity, P4 widgets) and the App Group they
# share with the app. Included by ../project.yml ONLY when the project is
# generated with SM_EXTENSIONS=YES:
#
#     cd apple && SM_EXTENSIONS=YES xcodegen generate
#
# **Off by default, because turning it on changes what signing needs**: a
# second bundle id, `dev.supermessage.ios.widgets`, and the App Group
# entitlement on both. Apple-side, done on 2026-09-28: the group
# `group.dev.supermessage.ios` is on both App IDs, and the
# `supermessage Widgets App Store` profile is in the IOS_WIDGETS_PROFILE_BASE64
# secret, installed by .github/workflows/testflight.yml and named in
# apple/ExportOptions.plist. Generated without this file, the app builds as
# before: no Live Activity (no extension to draw it) and nothing written for
# widgets (no group).
#
# Paths below are relative to this file; build settings are not rewritten by
# an include, so those stay relative to apple/ (SRCROOT).
targets:
  Supermessage:
    dependencies:
      # An app extension dependency is embedded in PlugIns by XcodeGen.
      - target: SupermessageWidgets
    entitlements:
      path: ../Supermessage/Platform/Supermessage.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.supermessage.ios

  SupermessageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources
      # The widgets' views and their button's intent. The app compiles these
      # too (project.yml): the intent runs in the app's process, and the
      # views' previews render with the app's.
      - path: Views
      # Shared with the app through SupermessageKit — one declaration each,
      # so the two processes cannot disagree about a shape.
      - path: ../SupermessageKit/Notifications/FleetActivityAttributes.swift
      - path: ../SupermessageKit/Notifications/WidgetSnapshot.swift
      # The palette. Generated; never edited by hand.
      - path: ../Supermessage/Generated/ThemeTokens.swift
    entitlements:
      path: SupermessageWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.supermessage.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermessage.ios.widgets
        # Empty everywhere but the TestFlight archive, which passes the
        # widgets profile's name — see SM_APP_PROFILE in project.yml.
        PROVISIONING_PROFILE_SPECIFIER: $(SM_WIDGETS_PROFILE)
        INFOPLIST_FILE: SupermessageWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: supermessage
        SWIFT_STRICT_CONCURRENCY: complete
        # Views/ is compiled here and in the app. There `WidgetSnapshot` is
        # SupermessageKit's; here it is this module's own copy of the file,
        # and this flag is how a shared file knows not to import the Kit.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SM_WIDGET_EXTENSION"
