# The `aps-environment` entitlement, for remote (APNs) push. Included by
# ../project.yml ONLY when generated with SM_PUSH=YES.
#
# Apple-side, done on 2026-09-28: the App ID `dev.supermessage.ios` has Push
# Notifications, App Groups and Time Sensitive Notifications, and the
# `supermessage iOS App Store` profile (IOS_PROFILE_BASE64) was regenerated to
# carry them. The gateway is the AgentPod hub's own
# (`https://hub.agentpod.dev/_matrix/push/v1/notify`, operator decision of
# 2026-09-28): it holds the APNs key and talks to Apple, and this app only
# registers a pusher pointing at it. The TestFlight workflow generates with
# SM_PUSH=YES, SM_NSE=YES, SM_EXTENSIONS=YES and that URL.
#
# Off (a local build, `xcodegen generate` with nothing set): no entitlement,
# `registerForRemoteNotifications` fails quietly, no pusher is registered, and
# local notifications still work.
#
# `development` is right for the archive: exporting for App Store Connect
# re-signs with the distribution profile's value, which is `production`.
targets:
  Supermessage:
    entitlements:
      path: ../Supermessage/Platform/Supermessage.entitlements
      properties:
        aps-environment: development
        # A decision (a permission request, a gate) is sent by the gateway
        # with `interruption-level: time-sensitive`, which iOS honours only
        # for an app holding this.
        com.apple.developer.usernotifications.time-sensitive: true
