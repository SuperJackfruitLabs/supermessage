[package]
name = "supermessage"
version = "0.0.8"
description = "Cross-platform, agent-aware Matrix chat client"
authors = ["supermessage contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "supermessage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Matrix core. Default features give e2e-encryption + automatic room key
# forwarding + the SQLite stores; `markdown` for formatted message bodies.
matrix-sdk = { version = "0.18", features = ["markdown", "bundled-sqlite"] }
matrix-sdk-ui = "0.18"
# Direct deps on the diff/collection types that already flow through
# matrix-sdk transitively (eyeball_im::Vector re-exports imbl::Vector); pinned
# explicitly because core::dto matches on VectorDiff and builds imbl::Vector
# values directly. imbl 6, not 5: eyeball-im 0.8 resolves imbl 6.x, and a `= "5"`
# constraint would pull a second, incompatible copy (see cargo tree -i imbl).
eyeball-im = "0.8"
imbl = "6"
keyring = "4.1"
rand = "0.9"
thiserror = "2"
futures-util = "0.3"
async-trait = "0.1"
# Encodes fetched avatar bytes as `data:` URIs (core::media). Already resolved
# transitively (matrix-sdk/reqwest pull base64 0.22.1 — see `cargo tree -p
# base64`); listed directly since core::media calls it by name.
base64 = "0.22"

# `fs` for `tokio::fs::{metadata, read}` in core::attachments: a `stat` and a
# whole-file read both block, and doing either on a runtime worker thread
# would stall every other task on it for as long as the disk takes.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pulled in explicitly so `rustls::crypto::ring` is available to install as the
# process-wide provider. See core::tls for why. matrix-sdk forces
# reqwest/rustls (= aws-lc-rs), so both providers are compiled in and rustls
# has no implicit default — one must be installed at startup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# The native file picker (core::attachments). Used through its **Rust** API
# (`DialogExt::dialog().file()`), never its JS one — see
# docs/superpowers/specs/2026-08-14-attachments-design.md §3. That is why
# `capabilities/default.json` grants no `dialog:*` permission at all: the
# webview must not be able to open a picker, because a picker it opened
# would hand *it* the path. The plugin drags `tauri-plugin-fs` in as a Rust
# dependency of its own (it registers picked/dropped paths with the fs
# scope); that is a crate in the tree, not a capability, and no `fs:*`
# permission is granted either.
tauri-plugin-dialog = "2"

# Image dimensions from the file *header* (core::attachments::image_dimensions).
# MIT, zero dependencies, pure header parsing — deliberately not the `image`
# crate: §5 needs two integers, and running a full decoder over a file a
# stranger may have chosen is a far larger attack surface for no gain.
#
# `default-features = false` plus an explicit format list, rather than the
# default "every format the crate knows": each feature is a separate parser
# compiled in, and the ~18 left off (dds, ktx2, vtf, psd, pvrtc, aesprite,
# …) are formats nobody attaches to a chat message. A format that isn't
# enabled simply yields no dimensions, which degrades to "an image with no
# width/height in its `info`" — the same thing that happens for a truncated
# or malformed header. The list below is every `image/*` type
# `mime_from_content` can actually recognise.
imagesize = { version = "0.15", default-features = false, features = [
    "bmp", "gif", "heif", "ico", "jpeg", "jxl", "png", "tiff", "webp",
] }

# Content-based mime detection (core::attachments::mime_from_content). §5:
# "an extension is a claim, not a fact". Already resolved transitively via
# tauri (see `cargo tree -i infer`); listed directly since core::attachments
# calls it by name. Reads only the first few KiB of the file, never the
# whole thing — which is the entire point at staging time (§4).
infer = "0.19"

# `mime::Mime`, the type `Timeline::send_attachment` takes and the type the
# SDK's own mime-family -> msgtype mapping switches on (see
# `msgtype_for_mime`). Already in the tree via reqwest/matrix-sdk; listed
# directly for the same reason `base64` is.
mime = "0.3"
# The embedded WebDriver server the WDIO Tauri service drives on macOS, where
# `tauri-driver` does not work at all (no WKWebView driver exists). Debug builds
# only — see `lib.rs`, where it is registered behind `debug_assertions`. It is
# how this app's UI can be tested at all without a human at the keyboard, which
# matters for a bug whose only symptom is what the rendered rows look like.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
# Lets a coding assistant *see* this app: screenshots, DOM and CSS, console
# logs, IPC traffic. Optional and NOT in `default`, unlike `wdio` — three
# rendering faults in one day got past every test here because nothing could
# look at the screen, and this is the answer to that; but it executes arbitrary
# JS in the webview and opens a socket, so it is compiled in only when somebody
# asks for it by name (`--features mcp`), never in CI and never in a release.
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }

[dev-dependencies]
# `testing` for matrix_sdk::test_utils (logged_in_client_with_server,
# no_retry_test_client_with_server, MatrixMockServer), wiremock to script the
# homeserver's HTTP responses in auth tests.
matrix-sdk = { version = "0.18", features = ["testing"] }
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `event_factory` builds real SDK events (EventFactory), fed through a
# MatrixMockServer-backed sync into a genuine matrix_sdk_ui::Timeline —
# see tests/timeline_projection.rs's module doc comment for why this, not
# hand-written DTOs, is what that file exists to exercise.
matrix-sdk-test = "0.18"

[lints.rust]
# `ruma`'s `EventContent` derive expands to `#[cfg(ruma_unstable_exhaustive_types)]`
# in the *consuming* crate, so rustc's check-cfg — which only knows the cfgs this
# crate declares — flags it as an unknown condition name. It is a real cfg owned
# by ruma, not a typo, so the fix is to declare it expected rather than to silence
# the lint.
#
# Deliberately `check-cfg` and not `#[allow(unexpected_cfgs)]`: the allow would
# switch the lint off for the whole item and hide a genuine typo'd cfg alongside
# this legitimate one. This names the single condition we accept and keeps the
# lint live for everything else.
#
# Only CI caught this: locally `unexpected_cfgs` is a warning, and CI sets
# `RUSTFLAGS: -D warnings`, which is the point of setting it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ruma_unstable_exhaustive_types)'] }

[features]
# On by default in a debug build; a release build never compiles it in.
default = ["wdio"]
wdio = ["dep:tauri-plugin-wdio-webdriver"]
mcp = ["dep:tauri-plugin-mcp-bridge"]
