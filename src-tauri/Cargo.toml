[package]
name = "supermessage"
version = "0.1.0"
description = "Cross-platform, agent-aware Matrix chat client"
authors = ["supermessage contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "supermessage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Matrix core. Default features give e2e-encryption + automatic room key
# forwarding + the SQLite stores; `markdown` for formatted message bodies.
matrix-sdk = { version = "0.18", features = ["markdown", "bundled-sqlite"] }
matrix-sdk-ui = "0.18"
keyring = "4.1"
rand = "0.9"
thiserror = "2"
futures-util = "0.3"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pulled in explicitly so `rustls::crypto::ring` is available to install as the
# process-wide provider. See core::tls for why. matrix-sdk forces
# reqwest/rustls (= aws-lc-rs), so both providers are compiled in and rustls
# has no implicit default — one must be installed at startup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
