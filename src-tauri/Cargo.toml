[package]
name = "supermessage"
version = "0.1.0"
description = "Cross-platform, agent-aware Matrix chat client"
authors = ["supermessage contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "supermessage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Matrix core. Default features give e2e-encryption + automatic room key
# forwarding + the SQLite stores; `markdown` for formatted message bodies.
matrix-sdk = { version = "0.18", features = ["markdown", "bundled-sqlite"] }
matrix-sdk-ui = "0.18"
# Direct deps on the diff/collection types that already flow through
# matrix-sdk transitively (eyeball_im::Vector re-exports imbl::Vector); pinned
# explicitly because core::dto matches on VectorDiff and builds imbl::Vector
# values directly. imbl 6, not 5: eyeball-im 0.8 resolves imbl 6.x, and a `= "5"`
# constraint would pull a second, incompatible copy (see cargo tree -i imbl).
eyeball-im = "0.8"
imbl = "6"
keyring = "4.1"
rand = "0.9"
thiserror = "2"
futures-util = "0.3"
async-trait = "0.1"
# Direct dep, at the same version matrix-sdk already resolves transitively, so
# this doesn't pull a second copy: core::auth::password matches on
# `ruma::api::error::ErrorKind::Forbidden` to tell a wrong password (403 /
# M_FORBIDDEN, CoreError::Auth) apart from a transport failure (CoreError::Network).
ruma = "0.16"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pulled in explicitly so `rustls::crypto::ring` is available to install as the
# process-wide provider. See core::tls for why. matrix-sdk forces
# reqwest/rustls (= aws-lc-rs), so both providers are compiled in and rustls
# has no implicit default — one must be installed at startup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
# `testing` for matrix_sdk::test_utils (logged_in_client_with_server,
# no_retry_test_client_with_server), wiremock to script the homeserver's HTTP
# responses in auth tests.
matrix-sdk = { version = "0.18", features = ["testing"] }
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
