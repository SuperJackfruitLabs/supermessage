[versions]
agp = "9.3.1"
kotlin = "2.4.0"
# 2026.08.00 pins androidx.compose.ui:ui-android 1.12.0, whose AAR metadata
# declares minCompileSdk=37 — a hard build error against this module's fixed
# compileSdk=36 (:app:checkDebugAarMetadata FAILED, 12 issues, all "requires
# ... version 37 or later"). 2026.06.01 is the newest BOM still pinning
# ui-android 1.11.4, whose minCompileSdk is 35.
composeBom = "2026.06.01"
# 1.3.0 has the same problem: adaptive-layout-android and
# adaptive-navigation-android both declare minCompileSdk=37. 1.2.0 declares 35.
adaptive = "1.2.0"
jna = "5.17.0"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.7.0"
# StreamingText (Task 2) is :kit's first consumer of coroutines; every later
# store built on top of it (LiveStore, EventPump, CoreClient) needs the same
# artifact, so it lives in the catalog rather than being added ad hoc later.
kotlinxCoroutines = "1.11.0"

[libraries]
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }
adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "adaptive" }
adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "adaptive" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# No kotlin-android alias: applying org.jetbrains.kotlin.android on top of
# this repo's AGP 9.3.1 is a hard configuration error (AGP 9.0+ has built-in
# Kotlin support). See :core's, :kit's, and :app's build.gradle.kts.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
