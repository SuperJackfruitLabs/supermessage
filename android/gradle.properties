org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Instrumented runs uninstall both APKs when they finish, which wipes the app's
# data and with it any signed-in session — meaning a human had to sign in again
# after every suite run. Development needs a session that survives the tests.
android.injected.androidTest.leaveApksInstalledAfterRun=true

# Compare the rendered previews against the committed baseline in
# app/src/test/previews, rather than overwriting it.
#
# Default-verify rather than default-capture, because the failure modes are
# not symmetric: a capture-by-default run quietly rewrites the baseline to
# match whatever the code now does, which is a gate that agrees with every
# regression. Re-record deliberately, and review the image diff:
#
#   ./gradlew :app:testDebugUnitTest --tests '*PreviewScreenshotTest*' \
#     -Proborazzi.test.record=true --rerun
roborazzi.test.verify=true
