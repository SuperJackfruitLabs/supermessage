<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>supermessage</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong
      // one. Mirrors `appearanceAttributes` in src/lib/appearance.ts; the
      // store re-applies the same rules once the app mounts.
      (function () {
        try {
          var s = window.localStorage;
          var mode = s.getItem("appearance.mode");
          var black = s.getItem("appearance.darkStyle") === "black";
          var accent = s.getItem("appearance.accent");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var a = mode === "light" ? "light"
            : mode === "dark" ? (black ? "black" : "dark")
            : dark && black ? "black" : null;
          var r = document.documentElement;
          if (a) r.setAttribute("data-appearance", a);
          if (/^(blue|graphite|green|pink|teal)$/.test(accent || "")) r.setAttribute("data-accent", accent);
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
