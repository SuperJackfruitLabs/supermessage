[package]
name = "supermessage-ffi"
version = "0.0.8"
description = "UniFFI bindings over supermessage-core, for Swift and Kotlin hosts"
edition = "2021"
license = "MIT"

[lib]
name = "supermessage_ffi"
# `staticlib` for the iOS XCFramework, `cdylib` for Android's `.so`, `lib` so
# the conversion tests can link it like an ordinary crate.
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
supermessage-core = { path = "../supermessage-core" }
uniffi = { version = "0.28", features = ["tokio", "cli"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
