# The design language, as one source.
#
# Generated into five targets by scripts/generate-tokens.py. Do not edit any
# generated file; edit this one and regenerate. CI fails on drift.
#
# Every colour carries the contrast contract it must satisfy, and the
# generator asserts all of them before writing a byte. That is what makes the
# accessibility floor a build failure rather than a comment — which is what
# it was, in three separate themes, until 2026-09-12.
#
# Three literals are inherited from the marketing site so the product and the
# site are recognisably one thing: #151129 (ink), #9d8ff0 (violet), #e8a33d
# (amber). Every other value is solved to a contrast target.
#
# Design: docs/superpowers/specs/2026-09-12-design-language-tokens-design.md
# Rules:  docs/design-language.md

[meta]
roles = [
  "surface", "surface-sunken", "surface-raised",
  "border", "border-strong",
  "content", "content-muted", "content-faint",
  "accent", "accent-content", "accent-soft",
  "signal", "signal-soft",
  "danger", "ok", "scrim",
]

# ---------------------------------------------------------------- light ----
# Desktop and web, when the OS asks for light.

[appearance.light.color]
surface = { value = "#fdfcff" }

# The sheet-on-field step: the reading column over the roster, header and
# composer. The whole three-level depth story rests on it, and it is what
# silently broke in the previous dark theme at 1.035 — less than half the
# step, and effectively subliminal across 1050px of field.
surface-sunken = { value = "#f3f2f9", contrast = [
  { against = "surface", min = 1.05, max = 1.13 },
] }

surface-raised = { value = "#fafafd" }
border = { value = "#e0deea" }
border-strong = { value = "#c3bfd4" }
content = { value = "#221c38", contrast = [{ against = "surface", min = 12.0 }] }
content-muted = { value = "#50496d", contrast = [{ against = "surface", min = 7.0 }] }

# The bottom rung is the whole ramp's constraint. It must clear the floor on
# all three grounds, not just the reading surface — the earlier cool-slate
# attempt passed on `surface` and measured 2.92:1 on `surface-sunken`.
content-faint = { value = "#70688f", contrast = [
  { against = "surface", min = 4.5 },
  { against = "surface-sunken", min = 4.5 },
  { against = "surface-raised", min = 4.5 },
] }

accent = { value = "#5b43d4" }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#ebe7fb", contrast = [{ against = "content", min = 4.5 }] }

# Amber, and it means exactly one thing: the reader owes someone an answer.
# 6.0 rather than 4.5 because it carries the 10px AWAITING YOUR DECISION
# label — the smallest text in the app, on the one element that must not be
# missed.
signal = { value = "#814904", contrast = [{ against = "signal-soft", min = 6.0 }] }
signal-soft = { value = "#fcf3e4" }

danger = { value = "#b4222a", contrast = [{ against = "surface", min = 4.5 }] }
ok = { value = "#1d7c59", contrast = [{ against = "surface", min = 4.5 }] }

# Not a fifth hue and not a new rank — the ramp's dark end used as a wash.
# Checked as a region drop (ground plus the text on it), never as a WCAG
# ratio and never against one surface: this scrim IS `content`, so measuring
# it against `content` alone would report 1.00x for a wash that works.
scrim = { value = "rgb(34 28 56 / 0.45)", drop = { min = 2.5 } }   # measures 3.01x

# ----------------------------------------------------------------- dark ----
# Every platform, when the OS asks for dark. Anchored on the landing page's
# own ink so arriving from the site does not feel like leaving it.

[appearance.dark.color]
surface = { value = "#1f1838" }
surface-sunken = { value = "#151129", contrast = [
  { against = "surface", min = 1.05, max = 1.13 },
] }
surface-raised = { value = "#251f41" }
border = { value = "#383254" }
border-strong = { value = "#534a75" }
content = { value = "#f4f2fb", contrast = [{ against = "surface", min = 12.0 }] }
content-muted = { value = "#c6c2d8", contrast = [{ against = "surface", min = 7.0 }] }

# In dark the worst ground is `surface-raised`, not `surface-sunken` — the
# ramp runs the other way. Listing all three is what makes that automatic
# rather than something a reader has to notice.
content-faint = { value = "#8e86ab", contrast = [
  { against = "surface", min = 4.5 },
  { against = "surface-sunken", min = 4.5 },
  { against = "surface-raised", min = 4.5 },
] }

accent = { value = "#9d8ff0" }
accent-content = { value = "#1a1433", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#2b224f", contrast = [{ against = "content", min = 4.5 }] }
signal = { value = "#e8a33d", contrast = [{ against = "signal-soft", min = 6.0 }] }
signal-soft = { value = "#332919" }
danger = { value = "#ed6e74", contrast = [{ against = "surface", min = 4.5 }] }
ok = { value = "#70cdab", contrast = [{ against = "surface", min = 4.5 }] }

# A dark theme scrims by going darker still, at a higher alpha, because the
# ground is already near the ramp's floor. Essentially all of a dark region's
# light is its text, which is what this wash takes away — and why measuring
# it against the ground alone reports 1.00x.
scrim = { value = "rgb(21 17 41 / 0.70)", drop = { min = 2.5 } }   # measures 6.95x

# ---------------------------------------------------------------- paper ----
# What "light" means on a phone. Same roles, same accent, warm ground.

[appearance.paper.color]
surface = { value = "#faf8f3" }
surface-sunken = { value = "#f2eee6", contrast = [
  { against = "surface", min = 1.05, max = 1.13 },
] }
surface-raised = { value = "#f7f6f1" }
border = { value = "#e1dbcd" }
border-strong = { value = "#c5bea8" }
content = { value = "#22192e", contrast = [{ against = "surface", min = 12.0 }] }
content-muted = { value = "#51475e", contrast = [{ against = "surface", min = 7.0 }] }
content-faint = { value = "#726681", contrast = [
  { against = "surface", min = 4.5 },
  { against = "surface-sunken", min = 4.5 },
  { against = "surface-raised", min = 4.5 },
] }
accent = { value = "#5b43d4" }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#ebe7fb", contrast = [{ against = "content", min = 4.5 }] }
signal = { value = "#814904", contrast = [{ against = "signal-soft", min = 6.0 }] }
signal-soft = { value = "#f7edda" }
danger = { value = "#b4222a", contrast = [{ against = "surface", min = 4.5 }] }
ok = { value = "#1d7c59", contrast = [{ against = "surface", min = 4.5 }] }
scrim = { value = "rgb(34 25 46 / 0.45)", drop = { min = 2.5 } }   # measures 3.07x

# ---------------------------------------------------------------- black ----
# Dark, with the conversation on true black: for OLED phones, where black is
# pixels switched off — deeper contrast, and less battery. A reader's choice
# (Account → Appearance), never a default. The depth story runs the other
# way here: the reading sheet is the black, and the field around it — header,
# composer, roster — is the step up, because nothing is darker than off.

[appearance.black.color]
surface = { value = "#000000" }
surface-sunken = { value = "#100f17", contrast = [
  { against = "surface", min = 1.05, max = 1.13 },
] }
surface-raised = { value = "#1a1824" }
border = { value = "#2c2a38" }
border-strong = { value = "#4a4660" }
content = { value = "#f4f2fb", contrast = [{ against = "surface", min = 12.0 }] }
content-muted = { value = "#c6c2d8", contrast = [{ against = "surface", min = 7.0 }] }
content-faint = { value = "#8e86ab", contrast = [
  { against = "surface", min = 4.5 },
  { against = "surface-sunken", min = 4.5 },
  { against = "surface-raised", min = 4.5 },
] }
accent = { value = "#9d8ff0", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#1a1433", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#241c42", contrast = [{ against = "content", min = 4.5 }] }
signal = { value = "#e8a33d", contrast = [{ against = "signal-soft", min = 6.0 }] }
signal-soft = { value = "#2a2114" }
danger = { value = "#ed6e74", contrast = [{ against = "surface", min = 4.5 }] }
ok = { value = "#70cdab", contrast = [{ against = "surface", min = 4.5 }] }
scrim = { value = "rgb(0 0 0 / 0.72)", drop = { min = 2.5 } }

# --------------------------------------------------------------- accents ----
# The accents a reader may choose (Account → Appearance). Violet is the
# default and lives in the appearances above; each entry here replaces only
# the three accent roles, per appearance, and carries the same contracts
# plus one more — the accent itself must read against the page (3.0, a
# control, not body text). Curated, never a colour wheel: a free choice
# cannot be held above these floors. Amber is not on the list and never
# will be — it means "you owe someone an answer", and nothing else.

[accent.blue.light]
accent = { value = "#2356c2", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#e4ecfb", contrast = [{ against = "content", min = 4.5 }] }
[accent.blue.paper]
accent = { value = "#2356c2", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#e3eaf7", contrast = [{ against = "content", min = 4.5 }] }
[accent.blue.dark]
accent = { value = "#8ab4ff", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#0d1630", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#1c2a4d", contrast = [{ against = "content", min = 4.5 }] }
[accent.blue.black]
accent = { value = "#8ab4ff", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#0d1630", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#16213d", contrast = [{ against = "content", min = 4.5 }] }

[accent.teal.light]
accent = { value = "#0b6e75", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#ddf1f1", contrast = [{ against = "content", min = 4.5 }] }
[accent.teal.paper]
accent = { value = "#0b6e75", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#dcece9", contrast = [{ against = "content", min = 4.5 }] }
[accent.teal.dark]
accent = { value = "#5fcfcf", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#062628", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#153739", contrast = [{ against = "content", min = 4.5 }] }
[accent.teal.black]
accent = { value = "#5fcfcf", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#062628", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#112c2e", contrast = [{ against = "content", min = 4.5 }] }

[accent.green.light]
accent = { value = "#2a7a35", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#e2f1e3", contrast = [{ against = "content", min = 4.5 }] }
[accent.green.paper]
accent = { value = "#2a7a35", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#e1ecdd", contrast = [{ against = "content", min = 4.5 }] }
[accent.green.dark]
accent = { value = "#7fd28a", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#0b2410", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#1a3620", contrast = [{ against = "content", min = 4.5 }] }
[accent.green.black]
accent = { value = "#7fd28a", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#0b2410", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#142b19", contrast = [{ against = "content", min = 4.5 }] }

[accent.pink.light]
accent = { value = "#b2266a", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#fae4ee", contrast = [{ against = "content", min = 4.5 }] }
[accent.pink.paper]
accent = { value = "#b2266a", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#f5e3e8", contrast = [{ against = "content", min = 4.5 }] }
[accent.pink.dark]
accent = { value = "#f48fc0", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#330a1f", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#3d1b2e", contrast = [{ against = "content", min = 4.5 }] }
[accent.pink.black]
accent = { value = "#f48fc0", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#330a1f", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#321625", contrast = [{ against = "content", min = 4.5 }] }

[accent.graphite.light]
accent = { value = "#45424f", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#ebeaef", contrast = [{ against = "content", min = 4.5 }] }
[accent.graphite.paper]
accent = { value = "#45424f", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#ffffff", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#ebe8e2", contrast = [{ against = "content", min = 4.5 }] }
[accent.graphite.dark]
accent = { value = "#cbc8d8", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#1c1a24", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#2e2a3f", contrast = [{ against = "content", min = 4.5 }] }
[accent.graphite.black]
accent = { value = "#cbc8d8", contrast = [{ against = "surface", min = 3.0 }] }
accent-content = { value = "#1c1a24", contrast = [{ against = "accent", min = 4.5 }] }
accent-soft = { value = "#26242f", contrast = [{ against = "content", min = 4.5 }] }

# ----------------------------------------------------------------- peers ----
# One colour per person, for their name and the bar on a quote of them —
# which is what tells "Strategy Sam" from "Strategy Sam (Hermes on Guild)"
# at a glance in a room full of agents. Seven, as Telegram has, chosen from
# the user id by the core (`peer_color_index`) so every device agrees. No
# amber and no orange: amber means one thing. Every entry is text, so every
# entry clears 4.5 on every ground a name is drawn on.

[peer.light]
colors = ["#b3261e", "#6a3fc8", "#2d7a36", "#0b6f86", "#2356c2", "#b0306e", "#555266"]
contrast = [{ against = "surface", min = 4.5 }, { against = "surface-raised", min = 4.5 }]
[peer.paper]
colors = ["#b3261e", "#6a3fc8", "#2d7a36", "#0b6f86", "#2356c2", "#b0306e", "#555266"]
contrast = [{ against = "surface", min = 4.5 }, { against = "surface-raised", min = 4.5 }]
[peer.dark]
colors = ["#f28b82", "#b9a4ff", "#7fd28a", "#6cd0e6", "#8ab4ff", "#f48fc0", "#b7b4c7"]
contrast = [{ against = "surface", min = 4.5 }, { against = "surface-raised", min = 4.5 }]
[peer.black]
colors = ["#f28b82", "#b9a4ff", "#7fd28a", "#6cd0e6", "#8ab4ff", "#f48fc0", "#b7b4c7"]
contrast = [{ against = "surface", min = 4.5 }, { against = "surface-raised", min = 4.5 }]

# ---------------------------------------------------------------- brand ----
# The mark: two overlapping speech bubbles, one logo on every surface — app
# icons on all three platforms, both favicons, the landing and docs headers.
#
# These are the mark's own colours and nothing else may use them. They were
# sampled from the source artwork and are not UI roles: a pastel blue carries
# no contrast contract because nothing is ever written on it. What the mark
# sits ON is a role, so an icon ground cannot be a colour the palette lacks —
# which is exactly how the iOS icon ended up on #F6F4EF and #171B22, the
# grounds of a theme that no longer exists.
#
# Each pair is a gradient's two stops. `overlap` is the blue bubble seen
# through the coral one, drawn rather than blended so it is the same at 16px
# and 1024px.

[brand.mark]
blue = { from = "#cbe1fb", to = "#9bc0fa" }
coral = { from = "#ffa98a", to = "#ff8489" }
overlap = { from = "#c0bcd2", to = "#cfacbd" }

# Where the mark is drawn on a ground of its own. `ink` is the landing page's
# #151129 — the pastel bubbles need a dark ground to read at dock and launcher
# sizes — and a platform with a single icon (desktop, Android) uses it. iOS
# alone asks for a light variant too.
[brand.ground]
ink = { appearance = "dark", role = "surface-sunken" }
paper = { appearance = "paper", role = "surface" }

# ----------------------------------------------------------------- type ----
# Structural, not decorative: serif is what an agent wrote, sans what the
# operator wrote, mono is data and sigils.
#
# Each role carries BOTH a web size and a native text *style*. That is not
# duplication. iOS gets Dynamic Type free because Theme.swift asks for a
# style (`Font.system(.body, design: .serif)`) rather than a size, and
# Android scales sp by the reader's own setting. Emitting a number into
# either would take that away silently, and the app would still look right
# to whoever made the change.

# Labels and metadata are sans, in sentence case. They were mono and set in
# capitals — `RAKESH GANGWAR`, `TODAY`, `GATE` — which read as a terminal
# beside prose, and three faces on one screen was the first thing a reader
# noticed and the last thing they wanted. Mono is for code, paths and ids.
[type.label]
family = "sans"
ios = "caption2"
android = "labelSmall"
web = { size = "0.6875rem", line_height = 1.25, weight = 600 }

[type.meta]
family = "sans"
ios = "caption"
android = "labelMedium"
web = { size = "0.65625rem", line_height = 1.3, weight = 400 }

[type.ui]
family = "sans"
ios = "footnote"
android = "bodySmall"
web = { size = "0.8125rem", line_height = 1.4 }

[type.ui-lg]
family = "sans"
ios = "subheadline"
android = "titleSmall"
web = { size = "0.9375rem", line_height = 1.4, weight = 600 }

# The one rank that is not text. A 64px avatar circle needs a glyph sized to
# the circle, and before this existed the room-info panel's fallback initial
# took the largest reading rank — so a 64px circle held a 15px letter and
# read as broken.
[type.avatar]
family = "sans"
ios = "title2"
android = "headlineSmall"
web = { size = "1.5rem", line_height = 1.0, weight = 500 }

# One voice for the conversation. Agent messages used to be serif and yours
# sans, which made every exchange look like a book with notes pasted in; the
# distinction between an agent and a person is now carried by the sender's
# badge and card, not by a typeface. Serif survives as `longread`, for the
# long-form report view.
[type.body]
family = "sans"
ios = "body"
android = "bodyLarge"
web = { size = "0.9375rem", line_height = 1.62, weight = 400 }

[type.longread]
family = "serif"
ios = "body"
android = "bodyLarge"
web = { size = "1rem", line_height = 1.62, weight = 400 }

[type.body-own]
family = "sans"
ios = "body"
android = "bodyMedium"
web = { size = "0.875rem", line_height = 1.5, weight = 400 }

# --------------------------------------------------------------- radius ----
# Named by role, not by size. `rounded-md` cannot be wrong because it says
# nothing; `radius-control` can. Values are the ones already in use, so this
# renames rather than redesigns.

[radius]
control = "6px"    # buttons, inputs, chips
card = "8px"       # the dispatch card, panels
pill = "9999px"    # avatars, badges
sharp = "0"        # full-bleed rows, dividers

# ------------------------------------------------------------ elevation ----
# Depth is the three-level surface ramp plus a hairline. Shadow means exactly
# one thing: floating ABOVE the page plane — a modal over its scrim, or a
# popover over content. Anything that is part of the page, however raised,
# uses the ramp instead; the login card lost its shadow on that rule.
#
# Web had six ad-hoc Tailwind shadows at three sizes and native had none at
# all, so a modal on iOS and Android sat on the page with nothing lifting it
# off.

[elevation.overlay]
web = "0 8px 24px rgb(0 0 0 / 0.18)"
ios = { radius = 12, y = 4 }
android = "8dp"

# --------------------------------------------------------------- motion ----
# Almost none, deliberately. These three are the budget, not an invitation:
# whether a transition is added at all is still a design question. The point
# is that before this the reduced-motion block was the ONLY motion policy, so
# anything anyone added was unbudgeted.

[motion]
quick = "120ms"
settle = "200ms"
easing = "cubic-bezier(0.2, 0, 0, 1)"

# --------------------------------------------------------------- layout ----
# The pane widths, and the breakpoints DERIVED from them.
#
# +page.svelte carried the arithmetic 1238 = 288 + 320 + 630 in a comment and
# then wrote 1238 as a bare literal ten times, with 1293 alongside it. Change
# the roster width and the breakpoint was silently wrong in ten places while
# the comment still claimed it was derived. The comment is now the code.

[layout]
roster = 288    # the room list
panel = 320     # the room-info panel when it is a third column
sheet = 630     # the reading surface's own designed width
# 56, not 55, and it was 55 in this file's first draft — an invented value
# that nobody had checked against SpacesRail.svelte, which is `w-14`. The
# derived with-rail breakpoint would have come out at 1293 instead of 1294,
# the panel would have taken a column one pixel early, and the sheet would
# have sat at 629px against its designed 630. Exactly the class of quiet
# wrongness this whole file exists to stop, introduced by the file itself.
rail = 56       # the spaces rail, when it is showing
